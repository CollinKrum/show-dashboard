<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Players — Diamond Dynasty Tracker</title>
  <meta name="description" content="Browse every MLB The Show 26 Diamond Dynasty card. Filter by position, team, series. Sort by Stat Score, Delta, OVR, or any stat." />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05080f;
      --bg3: #0d1425;
      --panel: #101829;
      --panel2: #141f33;
      --panel3: #192035;
      --line: rgba(255,255,255,.07);
      --line2: rgba(255,255,255,.13);
      --text: #e8edf8;
      --muted: #7a8aaa;
      --dim: #4a5570;
      --red: #e03030;
      --red2: #ff4545;
      --gold2: #ffd060;
      --gold3: #e8c84a;
      --blue2: #6fa3f5;
      --green: #2db87c;
      --green2: #4dda9c;
      --r: 14px;
      --r2: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: .025;
      pointer-events: none;
      z-index: 0;
    }

    a { color: inherit; text-decoration: none; }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      background: rgba(5,8,15,.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }

    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: .06em;
      display: flex; align-items: center; gap: 9px; flex-shrink: 0;
    }

    .nav-logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red2); }

    .nav-links { display: flex; gap: 2px; margin-left: 32px; }
    .nav-links a { font-size: .875rem; font-weight: 500; color: var(--muted); padding: 6px 12px; border-radius: 8px; transition: color .15s, background .15s; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); background: rgba(255,255,255,.06); }

    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .nav-badge { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: rgba(224,48,48,.15); color: var(--red2); border: 1px solid rgba(224,48,48,.3); border-radius: 999px; padding: 4px 10px; }

    /* LAYOUT */
    .wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 28px; }

    .page-top {
      padding: 88px 0 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .page-eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--red2); margin-bottom: 6px; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.4rem, 5vw, 4rem); letter-spacing: .02em; line-height: 1; }
    .page-count { font-size: .875rem; color: var(--muted); margin-top: 6px; }

    /* FILTER BAR */
    .filter-bar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r2);
      padding: 16px 20px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      gap: 10px;
      align-items: center;
    }

    .filter-bar input,
    .filter-bar select {
      background: var(--panel2);
      border: 1px solid var(--line2);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      outline: none;
      width: 100%;
      transition: border-color .15s;
      appearance: none;
    }

    .filter-bar input:focus,
    .filter-bar select:focus { border-color: var(--red); }
    .filter-bar input::placeholder { color: var(--dim); }
    .filter-bar select option { background: #141f33; }

    /* SORT TABS */
    .sort-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .sort-tab {
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .05em;
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--line2);
      background: none;
      cursor: pointer;
      transition: all .15s;
      font-family: 'DM Sans', sans-serif;
    }

    .sort-tab:hover { color: var(--text); background: rgba(255,255,255,.06); }
    .sort-tab.active { color: var(--text); background: rgba(224,48,48,.12); border-color: rgba(224,48,48,.35); }

    /* TIER HEADER */
    .tier-hdr {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 32px 0 14px;
    }

    .tier-hdr:first-child { margin-top: 0; }

    .tier-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .tier-line { flex: 1; height: 1px; background: var(--line); }
    .tier-count { font-size: .78rem; font-weight: 700; color: var(--dim); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }

    /* PLAYER GRID */
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    /* PLAYER CARD */
    .pcard {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r2);
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .18s, transform .15s, background .18s;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .pcard:hover {
      border-color: var(--line2);
      transform: translateY(-2px);
      background: var(--panel3);
    }

    /* Rarity accent stripe */
    .pcard::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      opacity: 0;
      transition: opacity .2s;
    }

    .pcard.rarity-diamond::before { background: linear-gradient(90deg, #6fa3f5, #c084fc); opacity: 1; }
    .pcard.rarity-gold::before { background: linear-gradient(90deg, #ffd060, #e8b832); opacity: 1; }
    .pcard.rarity-silver::before { background: linear-gradient(90deg, #9ca3af, #d1d5db); opacity: 1; }

    .pcard-main {
      display: flex;
      gap: 0;
      padding: 14px;
      align-items: flex-start;
      flex: 1;
    }

    .pcard-img-wrap {
      flex-shrink: 0;
      width: 76px;
      position: relative;
    }

    .pcard-img {
      width: 76px;
      height: 102px;
      border-radius: 10px;
      background: var(--bg3);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .pcard-img img { width: 100%; height: 100%; object-fit: cover; }

    .pcard-ovr {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.85rem;
      background: rgba(5, 8, 15, 0.9);
      border: 1px solid var(--line2);
      border-radius: 5px;
      padding: 2px 6px;
      color: var(--gold2);
      line-height: 1;
      white-space: nowrap;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .pcard-ovr span {
      font-size: 0.6rem;
      color: var(--muted);
      margin-left: 1px;
    }

    .pcard-info {
      flex: 1;
      min-width: 0;
      padding: 0 14px;
      margin-top: 2px;
    }

    .pcard-name {
      font-weight: 700;
      font-size: .95rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .pcard-meta {
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pcard-series {
      display: inline-block;
      font-size: .63rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--dim);
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 2px 7px;
    }

    .pcard-rating {
      flex-shrink: 0;
      text-align: center;
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      min-width: 52px;
    }

    .pcard-rating.elite {
      background: rgba(255,208,96,.08);
      border-color: rgba(255,208,96,.2);
    }

    .pcard-rating.great {
      background: rgba(77,218,156,.07);
      border-color: rgba(77,218,156,.2);
    }

    .pcard-rating.good {
      background: rgba(111,163,245,.07);
      border-color: rgba(111,163,245,.2);
    }

    .pcard-rating-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      line-height: 1;
    }

    .pcard-rating.elite .pcard-rating-num { color: var(--gold2); }
    .pcard-rating.great .pcard-rating-num { color: var(--green2); }
    .pcard-rating.good .pcard-rating-num { color: var(--blue2); }

    .pcard-rating-label {
      font-size: .58rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--dim);
      margin-top: 3px;
    }

    .pcard-rating-label.delta-pos { color: var(--green2); }
    .pcard-rating-label.delta-neg { color: var(--red2); }
    .pcard-rating-label.delta-even { color: var(--muted); }

    .pcard-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
    }

    .pcard-stat {
      text-align: center;
      padding: 8px 4px;
      border-right: 1px solid var(--line);
    }

    .pcard-stat:last-child { border-right: none; }

    .pcard-stat-val {
      font-weight: 700;
      font-size: .9rem;
      line-height: 1;
    }

    .pcard-stat-val.high { color: var(--green2); }
    .pcard-stat-val.mid { color: var(--gold2); }
    .pcard-stat-val.low { color: var(--muted); }

    .pcard-stat-key {
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--dim);
      margin-top: 3px;
    }

    /* EMPTY STATE */
    .empty { padding: 60px 0; text-align: center; color: var(--muted); font-size: .95rem; }

    /* MODAL */
    .modal { position: fixed; inset: 0; z-index: 1000; display: none; }
    .modal.open { display: block; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(6px); }

    .modal-panel {
      position: relative;
      z-index: 2;
      width: min(900px, calc(100% - 32px));
      max-height: calc(100vh - 48px);
      overflow: auto;
      margin: 24px auto;
      background: var(--panel);
      border: 1px solid var(--line2);
      border-radius: 28px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5);
    }

    .modal-close {
      position: sticky;
      top: 16px;
      float: right;
      margin: 16px 16px 0 0;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--line2);
      background: var(--panel2);
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s, background .15s;
      flex-shrink: 0;
    }

    .modal-close:hover { color: var(--text); background: rgba(255,255,255,.1); }

    .modal-body { padding: 24px 28px 32px; clear: both; }

    .modal-hero {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 20px;
      margin-bottom: 24px;
      align-items: start;
    }

    .modal-img {
      width: 120px; height: 160px;
      border-radius: 14px;
      border: 1px solid var(--line2);
      background: var(--bg3);
      object-fit: cover;
    }

    .modal-head-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      line-height: .95;
      margin-bottom: 10px;
    }

    .modal-pills { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }

    .pill {
      font-size: .72rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--line2);
      background: var(--panel2);
      color: var(--muted);
    }

    .pill.ddt { background: rgba(255,208,96,.1); border-color: rgba(255,208,96,.3); color: var(--gold2); }
    .pill.diamond { background: rgba(111,163,245,.1); border-color: rgba(111,163,245,.3); color: var(--blue2); }
    .pill.gold-rarity { background: rgba(255,208,96,.08); border-color: rgba(255,208,96,.25); color: var(--gold2); }

    .modal-section { margin-top: 20px; }
    .modal-section-title { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 12px; }

    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

    .stat-box {
      background: var(--bg3);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 10px;
      text-align: center;
    }

    .stat-box-val { font-weight: 700; font-size: 1.25rem; line-height: 1; }
    .stat-box-val.s-elite { color: var(--gold2); }
    .stat-box-val.s-high { color: var(--green2); }
    .stat-box-val.s-mid { color: var(--text); }
    .stat-box-val.s-low { color: var(--muted); }
    .stat-box-label { font-size: .68rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); margin-top: 4px; }

    .ddt-bar-wrap { margin-top: 16px; }

    .ddt-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
    }

    .ddt-bar-label { font-size: .78rem; font-weight: 600; color: var(--muted); width: 80px; flex-shrink: 0; text-align: right; }
    .ddt-bar-track { flex: 1; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
    .ddt-bar-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }
    .ddt-bar-val { font-size: .78rem; font-weight: 700; color: var(--text); width: 30px; text-align: right; flex-shrink: 0; }

    .bar-contact { background: linear-gradient(90deg, #6fa3f5, #a78bfa); }
    .bar-power { background: linear-gradient(90deg, #ff4545, #f97316); }
    .bar-speed { background: linear-gradient(90deg, #4dda9c, #22d3ee); }
    .bar-fielding { background: linear-gradient(90deg, #ffd060, #fb923c); }
    .bar-vision { background: linear-gradient(90deg, #c084fc, #818cf8); }
    .bar-velocity { background: linear-gradient(90deg, #ff4545, #f97316); }
    .bar-control { background: linear-gradient(90deg, #6fa3f5, #22d3ee); }
    .bar-break { background: linear-gradient(90deg, #4dda9c, #a78bfa); }
    .bar-clutch { background: linear-gradient(90deg, #ffd060, #fb923c); }

    .quirks-list {
      font-size: .83rem;
      color: var(--muted);
      line-height: 1.7;
    }

    /* FOOTER */
    footer { border-top: 1px solid var(--line); padding: 28px 0; margin-top: 40px; }
    .footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .footer-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 7px; }
    .footer-copy { font-size: .75rem; color: var(--dim); }

    /* MOBILE */
    .hamburger { display: none; background: none; border: 1px solid var(--line2); color: var(--text); padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; line-height: 1; }
    .hamburger:hover { background: rgba(255,255,255,.06); }
    .mobile-menu { display: none; position: fixed; top: 60px; left: 0; right: 0; z-index: 99; background: rgba(5,8,15,.97); backdrop-filter: blur(18px); border-bottom: 1px solid var(--line); padding: 10px 16px; flex-direction: column; gap: 2px; }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { font-size: .9rem; font-weight: 500; color: var(--muted); padding: 10px 12px; border-radius: 8px; }
    .mobile-menu a:hover { color: var(--text); background: rgba(255,255,255,.06); }

    @media (max-width: 900px) {
      .filter-bar { grid-template-columns: 1fr 1fr; }
      .filter-bar input { grid-column: 1 / -1; }
      .player-grid { grid-template-columns: 1fr; }
      .modal-hero { grid-template-columns: 88px 1fr; }
      .modal-img { width: 88px; height: 120px; }
      .stat-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 780px) {
      .nav-links { display: none; }
      .hamburger { display: block; }
      .wrap { padding: 0 14px; }
      nav { padding: 0 14px; }
      .player-grid { grid-template-columns: 1fr; }
      .filter-bar { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .modal-body { padding: 16px 16px 24px; }
    }
  </style>
</head>

<nav>
  <a href="./index.html" class="nav-logo"><div class="dot"></div>DDTracker</a>
  <div class="nav-links">
    <a href="./index.html">Home</a>
    <a href="./players.html" class="active">Players</a>
    <a href="./collections.html">Collections</a>

    <button class="hamburger" id="hamburger">☰</button>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="./index.html">Home</a>
  <a href="./players.html" class="active">Players</a>
  <a href="./collections.html">Collections</a>
  <a href="./guides.html">Guides</a>
</div>

<main class="wrap">
  <div class="page-top">
    <div>
      <div class="page-eyebrow">Diamond Dynasty · Show 26</div>
      <h1 class="page-title">Players</h1>
      <div class="page-count" id="pageCount">Loading database…</div>
    </div>
  </div>

  <div class="filter-bar">
    <input id="search" placeholder="Search player, team, series…" type="search" autocomplete="off" />
    <select id="filterPosition"><option value="">All Positions</option></select>
    <select id="filterTeam"><option value="">All Teams</option></select>

  <div class="sort-tabs" id="sortTabs">
    <button class="sort-tab" data-sort="stat_score">Stat Score</button>
    <button class="sort-tab" data-sort="ddt_delta">Delta</button>
    <button class="sort-tab active" data-sort="ovr">OVR ▾</button>

  </div>
</div>

<footer>
  <div class="wrap">
    <div class="footer-inner">
      <div class="footer-logo"><div style="width:6px;height:6px;border-radius:50%;background:var(--dim)"></div>Diamond Dynasty Tracker</div>
      <div class="footer-copy">Not affiliated with San Diego Studios or MLB.</div>
    </div>
  </div>
</footer>

<script>
const DATA_URL = './data/show_cards_latest.json';
let players = [];
let currentSort = 'ovr';
const $ = id => document.getElementById(id);

// ── DDT Stat Score Formula (NO OVR) ─────────────────────────────────────────
function calcDDTRating(r) {
  const n = v => {
    const x = Number(String(v ?? '').replace(/[$,]/g,''));
    return Number.isFinite(x) ? x : 0;
  };

  const isPitcher =
    r.is_pitcher === 'true' ||
    r.is_pitcher === true ||
    ['SP','RP','CP'].includes(r.display_position);

  // Pitchers: pure attribute score, no OVR involved.
  if (isPitcher) {
    const vel = n(r.velocity);
    const ctrl = n(r.control);
    const brk = n(r.break);
    const clutch = n(r.pitch_clutch);
    const stamina = n(r.stamina);

    const raw =
      (vel * 0.30) +
      (ctrl * 0.28) +
      (brk * 0.22) +
      (clutch * 0.12) +
      (stamina * 0.08);

    return Math.round(Math.min(99, Math.max(0, raw)));
  }

  const pos = r.display_position || '';

  const contact = Math.max(
    n(r.contact_l),
    n(r.contact_r),
    (n(r.contact_l) + n(r.contact_r)) / 2
  );

  const power = Math.max(
    n(r.power_l),
    n(r.power_r),
    (n(r.power_l) + n(r.power_r)) / 2
  );

  const speed = n(r.speed);
  const fielding = n(r.fielding);
  const vision = n(r.vision);
  const arm = n(r.arm_strength);

  // Base hitter weights from your Step 1.
  let w = {
    contact: 0.25,
    power: 0.22,
    speed: 0.18,
    fielding: 0.18,
    vision: 0.12,
    arm: 0.05
  };

  // Position weight shifts.
  if (['CF','LF','RF'].includes(pos)) {
    w = { contact: 0.22, power: 0.18, speed: 0.24, fielding: 0.22, vision: 0.09, arm: 0.05 };
  }
  else if (['SS','2B'].includes(pos)) {
    w = { contact: 0.24, power: 0.15, speed: 0.20, fielding: 0.25, vision: 0.11, arm: 0.05 };
  }
  else if (pos === 'C') {
    w = { contact: 0.22, power: 0.18, speed: 0.05, fielding: 0.30, vision: 0.12, arm: 0.13 };
  }
  else if (pos === '1B') {
    w = { contact: 0.24, power: 0.32, speed: 0.05, fielding: 0.12, vision: 0.17, arm: 0.10 };
  }
  else if (pos === '3B') {
    w = { contact: 0.22, power: 0.26, speed: 0.08, fielding: 0.20, vision: 0.10, arm: 0.14 };
  }

  const raw =
    (contact * w.contact) +
    (power * w.power) +
    (speed * w.speed) +
    (fielding * w.fielding) +
    (vision * w.vision) +
    (arm * w.arm);

  // Step 2: normalized/clamped to 0–99 so it lives beside OVR.
  return Math.round(Math.min(99, Math.max(0, raw)));
}

function formatDelta(v) {
  const d = Math.round(num(v));
  return `${d >= 0 ? '+' : ''}${d}`;
}

function deltaClass(v) {
  const d = Math.round(num(v));
  if (d >= 5) return 'delta-pos';
  if (d <= -5) return 'delta-neg';
  return 'delta-even';
}

function ratingTier(s) {
  if (s >= 88) return 'elite';
  if (s >= 78) return 'great';
  return 'good';
}

function statColor(v) {
  if (v >= 90) return 's-elite';
  if (v >= 80) return 's-high';
  if (v >= 65) return 's-mid';
  return 's-low';
}

function cardStatColor(v) {
  if (v >= 90) return 'high';
  if (v >= 75) return 'mid';
  return 'low';
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function num(v) { const x = Number(String(v ?? '').replace(/[$,]/g,'')); return Number.isFinite(x) ? x : 0; }
function text(v) { return v == null || v === '' ? '—' : String(v); }

function esc(v) { 
  return String(v ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#39;'); 
}

function getPos(p) { return text(p.display_position || p.position || ''); }
function getTeam(p) { return text(p.team_short || p.team || ''); }
function getSeries(p) { return text(p.series || p.rarity || ''); }
function getRarity(p) { return text(p.rarity || ''); }
function getContact(p) { return Math.max(num(p.contact_l), num(p.contact_r), Math.round((num(p.contact_l)+num(p.contact_r))/2)); }
function getPower(p) { return Math.max(num(p.power_l), num(p.power_r), Math.round((num(p.power_l)+num(p.power_r))/2)); }
function rarityClass(p) { const r = getRarity(p).toLowerCase(); if (r === 'diamond') return 'rarity-diamond'; if (r === 'gold') return 'rarity-gold'; if (r === 'silver') return 'rarity-silver'; return ''; }

function getSortVal(p, key) {
  if (key === 'ddt_rating' || key === 'stat_score') return p.stat_score ?? p.ddt_rating;
  if (key === 'ddt_delta') return p.ddt_delta;
  if (key === 'ovr') return num(p.ovr);
  if (key === 'contact') return getContact(p);
  if (key === 'power') return getPower(p);
  if (key === 'speed') return num(p.speed);
  if (key === 'fielding') return num(p.fielding);
  if (key === 'vision') return num(p.vision);
  if (key === 'velocity') return num(p.velocity);
  if (key === 'control') return num(p.control);
  if (key === 'name') return text(p.name).toLowerCase();
  return 0;
}

function tierName(ovr) {
  if (ovr >= 95) return 'Elite 95+';
  if (ovr >= 90) return 'Diamond 90–94';
  if (ovr >= 85) return 'High Gold 85–89';
  if (ovr >= 80) return 'Gold 80–84';
  if (ovr >= 70) return 'Silver 70–79';
  return 'Common <70';
}

// ── Filters ───────────────────────────────────────────────────────────────────
function populateFilters() {
  const positions = [...new Set(players.map(getPos).filter(v => v !== '—'))].sort();
  const teams = [...new Set(players.map(getTeam).filter(v => v !== '—'))].sort();
  const rarities = [...new Set(players.map(getRarity).filter(v => v !== '—'))].sort();
  const series = [...new Set(players.map(getSeries).filter(v => v !== '—'))].sort();

  $('filterPosition').innerHTML = '<option value="">All Positions</option>' + positions.map(v => `<option>${esc(v)}</option>`).join('');
  $('filterTeam').innerHTML = '<option value="">All Teams</option>' + teams.map(v => `<option>${esc(v)}</option>`).join('');
  $('filterRarity').innerHTML = '<option value="">All Rarities</option>' + rarities.map(v => `<option>${esc(v)}</option>`).join('');
  $('filterSeries').innerHTML = '<option value="">All Series</option>' + series.map(v => `<option>${esc(v)}</option>`).join('');
}

function filteredSorted() {
  const q = $('search').value.trim().toLowerCase();
  const pos = $('filterPosition').value;
  const team = $('filterTeam').value;
  const rarity = $('filterRarity').value;
  const series = $('filterSeries').value;

  let out = players.filter(p => {
    const hay = [p.name, getTeam(p), getPos(p), getSeries(p), getRarity(p)].join(' ').toLowerCase();
    return (!q || hay.includes(q))
      && (!pos || getPos(p) === pos)
      && (!team || getTeam(p) === team)
      && (!rarity || getRarity(p) === rarity)
      && (!series || getSeries(p) === series);
  });

  out.sort((a, b) => {
    const av = getSortVal(a, currentSort);
    const bv = getSortVal(b, currentSort);
    if (currentSort === 'name') return av.localeCompare(bv);
    return bv - av;
  });

  return out;
}

// ── Render Card ───────────────────────────────────────────────────────────────
function isPitcher(p) {
  return ['SP','RP','CP'].includes(p.display_position) || p.is_pitcher === 'true' || p.is_pitcher === true;
}

function cardStats(p) {
  if (isPitcher(p)) {
    return [
      { key: 'VEL', val: num(p.velocity) },
      { key: 'CTRL', val: num(p.control) },
      { key: 'BRK', val: num(p.break) },
      { key: 'CLUT', val: num(p.pitch_clutch) },
    ];
  }
  return [
    { key: 'CON', val: getContact(p) },
    { key: 'PWR', val: getPower(p) },
    { key: 'SPD', val: num(p.speed) },
    { key: 'FLD', val: num(p.fielding) },
  ];
}

function playerCard(p, masterIdx) {
  const rating = p.ddt_rating;
  const tier = ratingTier(rating);
  const ovr = num(p.ovr);
  const stats = cardStats(p);
  const img = p.img || '';
  const rc = rarityClass(p);

  return `<div class="pcard ${rc}" data-idx="${masterIdx}" role="button" tabindex="0" aria-label="${esc(p.name)}">
    <div class="pcard-main">
      <div class="pcard-img-wrap">
        <div class="pcard-img">${img ? `<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">` : ''}</div>
        <div class="pcard-ovr">${ovr}<span>OVR</span></div>
      </div>
      <div class="pcard-info">
        <div class="pcard-name">${esc(text(p.name))}</div>
        <div class="pcard-meta">${esc(getTeam(p))} · ${esc(getPos(p))}</div>
        <div class="pcard-series">${esc(getSeries(p))}</div>
      </div>
      <div class="pcard-rating ${tier}">
        <div class="pcard-rating-num">${p.stat_score}</div>
        <div class="pcard-rating-label ${deltaClass(p.ddt_delta)}">${formatDelta(p.ddt_delta)}</div>
      </div>
    </div>
    <div class="pcard-stats">
      ${stats.map(s => `
        <div class="pcard-stat">
          <div class="pcard-stat-val ${cardStatColor(s.val)}">${s.val || '—'}</div>
          <div class="pcard-stat-key">${s.key}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

// ── Render all ────────────────────────────────────────────────────────────────
function render() {
  const filtered = filteredSorted();
  $('pageCount').textContent = `${filtered.length.toLocaleString()} of ${players.length.toLocaleString()} players`;

  if (!filtered.length) {
    $('results').innerHTML = '<div class="empty">No players match those filters.</div>';
    return;
  }

  const groups = {};
  const order = ['Elite 95+','Diamond 90–94','High Gold 85–89','Gold 80–84','Silver 70–79','Common <70'];
  for (const p of filtered) {
    const k = tierName(num(p.ovr));
    if (!groups[k]) groups[k] = [];
    groups[k].push(p);
  }

  let html = '';
  for (const key of order) {
    const group = groups[key];
    if (!group?.length) continue;
    html += `<div class="tier-hdr">
      <div class="tier-label">${key}</div>
      <div class="tier-line"></div>
      <div class="tier-count">${group.length.toLocaleString()} cards</div>
    </div>
    <div class="player-grid">
      ${group.map(p => {
        const masterIdx = players.findIndex(item => item === p);
        return playerCard(p, masterIdx);
      }).join('')}
    </div>`;
  }

  $('results').innerHTML = html;
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function statBar(label, val, cls) {
  return `<div class="ddt-bar-row">
    <div class="ddt-bar-label">${label}</div>
    <div class="ddt-bar-track"><div class="ddt-bar-fill ${cls}" style="width:${Math.min(100, val)}%"></div></div>
    <div class="ddt-bar-val">${val || '—'}</div>
  </div>`;
}

function openModal(masterIdx) {
  const p = players[masterIdx];
  if (!p) return;

  const rating = p.ddt_rating;
  const tier = ratingTier(rating);
  const ovr = num(p.ovr);
  const img = p.img || '';
  const pitcher = isPitcher(p);
  const rarityLabel = getRarity(p);
  const rarityPillClass = rarityLabel.toLowerCase() === 'diamond' ? 'diamond' : rarityLabel.toLowerCase() === 'gold' ? 'gold-rarity' : '';

  const coreStats = pitcher ? [
    { label:'Velocity', val:num(p.velocity) },
    { label:'Control', val:num(p.control) },
    { label:'Break', val:num(p.break) },
    { label:'Clutch', val:num(p.pitch_clutch) },
    { label:'Stamina', val:num(p.stamina) },
    { label:'K/BF', val:num(p.k_per_bf) },
    { label:'BB9', val:num(p.bb9) },
    { label:'HR9', val:num(p.hr9) },
  ] : [
    { label:'Contact L', val:num(p.contact_l) },
    { label:'Contact R', val:num(p.contact_r) },
    { label:'Power L', val:num(p.power_l) },
    { label:'Power R', val:num(p.power_r) },
    { label:'Speed', val:num(p.speed) },
    { label:'Fielding', val:num(p.fielding) },
    { label:'Vision', val:num(p.vision) },
    { label:'Arm', val:num(p.arm_strength) },
  ];

  const ddt_breakdown = pitcher
    ? [
        statBar('Velocity (30%)', num(p.velocity), 'bar-velocity'),
        statBar('Control (28%)', num(p.control), 'bar-control'),
        statBar('Break (22%)', num(p.break), 'bar-break'),
        statBar('Clutch (12%)', num(p.pitch_clutch), 'bar-clutch'),
        statBar('Stamina (8%)', num(p.stamina), 'bar-fielding'),
      ]
    : [
        statBar('Contact', getContact(p), 'bar-contact'),
        statBar('Power', getPower(p), 'bar-power'),
        statBar('Speed', num(p.speed), 'bar-speed'),
        statBar('Fielding', num(p.fielding), 'bar-fielding'),
        statBar('Vision', num(p.vision), 'bar-vision'),
        statBar('Arm', num(p.arm_strength), 'bar-clutch'),
      ];

  $('modalContent').innerHTML = `
    <div class="modal-hero">
      ${img ? `<img class="modal-img" src="${esc(img)}" alt="${esc(p.name)}">` : `<div class="modal-img"></div>`}
      <div>
        <div class="modal-head-name">${esc(text(p.name))}</div>
        <div class="modal-pills">
          <span class="pill ddt">Stat Score: ${p.stat_score}</span>
          <span class="pill ${p.ddt_delta >= 0 ? 'diamond' : 'gold-rarity'}">Delta: ${formatDelta(p.ddt_delta)}</span>
          <span class="pill">${ovr} OVR</span>
          <span class="pill">${esc(getPos(p))}</span>
          <span class="pill">${esc(getTeam(p))}</span>
          ${rarityLabel ? `<span class="pill ${rarityPillClass}">${esc(rarityLabel)}</span>` : ''}
          <span class="pill">${esc(getSeries(p))}</span>
          ${p.bat_hand ? `<span class="pill">B: ${esc(p.bat_hand)} / T: ${esc(p.throw_hand || '—')}</span>` : ''}
        </div>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">${pitcher ? 'Pitching Attributes' : 'Batting & Fielding'}</div>
      <div class="stat-grid">
        ${coreStats.map(s => `<div class="stat-box">
          <div class="stat-box-val ${statColor(s.val)}">${s.val || '—'}</div>
          <div class="stat-box-label">${esc(s.label)}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Stat Score Breakdown</div>
      <div class="ddt-bar-wrap">${ddt_breakdown.join('')}</div>
    </div>

    ${p.quirks ? `<div class="modal-section">
      <div class="modal-section-title">Quirks</div>
      <div class="quirks-list">${esc(p.quirks)}</div>
    </div>` : ''}
  `;

  $('playerModal').classList.add('open');
}

function closeModal() { $('playerModal').classList.remove('open'); }

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('Could not load player data.');
    const raw = await res.json();
    players = raw.filter(p => p && p.name).map(p => {
      const statScore = calcDDTRating(p);
      const ovr = num(p.ovr);
      return {
        ...p,
        ddt_rating: statScore,
        stat_score: statScore,
        ddt_delta: statScore - ovr
      };
    });
    populateFilters();
    render();
  } catch(err) {
    $('pageCount').textContent = 'Could not load player data.';
    $('results').innerHTML = `<div class="empty">${esc(err.message)}</div>`;
  }
}

// Events
['search','filterPosition','filterTeam','filterRarity','filterSeries'].forEach(id => {
  $(id).addEventListener('input', render);
  $(id).addEventListener('change', render);
});

$('sortTabs').addEventListener('click', e => {
  const btn = e.target.closest('.sort-tab');
  if (!btn) return;
  document.querySelectorAll('.sort-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentSort = btn.dataset.sort;
  render();
});

$('results').addEventListener('click', e => {
  const card = e.target.closest('.pcard[data-idx]');
  if (card) openModal(Number(card.dataset.idx));
});

$('results').addEventListener('keydown', e => {
  const card = e.target.closest('.pcard[data-idx]');
  if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openModal(Number(card.dataset.idx)); }
});

$('modalBg').addEventListener('click', closeModal);
$('modalClose').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.getElementById('hamburger').addEventListener('click', () => {
  document.getElementById('mobileMenu').classList.toggle('open');
});

init();
</script>
</body>
</html>
